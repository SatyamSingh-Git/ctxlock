name: self-test

on:
  pull_request:
  # A push to main is code scanning's analysis of the branch, which pull requests are compared with.
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  ctxlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./
        with:
          sarif: 'true'
